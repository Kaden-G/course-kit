<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Course Kit{% endblock %}</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c1f24;--muted:#5f6670;--line:#e2e5ea;--accent:#1f5fbf;--accent-ink:#fff;--ok:#1a7f4b;--warn:#b7791f;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--card:#1b1e23;--ink:#e8eaee;--muted:#9aa3ad;--line:#2b3037;--accent:#6ea8ff;--accent-ink:#0b1b33}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
header a{color:var(--ink);text-decoration:none;font-weight:600}header a.brand{font-size:18px}header a.sub{color:var(--muted);font-weight:500}
main{max-width:1040px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:0 0 16px}
h1{font-size:24px;margin:0 0 6px}h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
button.ghost,.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button.chip{background:var(--bg);color:var(--ink);border:1px solid var(--line);font-weight:500;padding:7px 12px;border-radius:999px}
button.chip:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:wait}
input[type=text],input[type=password],select,textarea{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:140px;line-height:1.55}textarea.draft{min-height:420px;font-size:16px}
label{display:block;font-weight:600;margin:12px 0 4px}label small{font-weight:400;color:var(--muted)}
ul.plain{list-style:none;padding:0;margin:0}ul.plain li{padding:8px 0;border-top:1px solid var(--line)}ul.plain li:first-child{border-top:0}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);margin-left:6px}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.warn{color:var(--warn);border-color:var(--warn)}
pre.log{background:#0f1115;color:#d7dbe0;padding:12px;border-radius:8px;max-height:280px;overflow:auto;font-size:13px;white-space:pre-wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
.notice{padding:10px 14px;border-radius:8px;background:var(--bg);border:1px solid var(--line);margin-bottom:14px}
.notice.warn{border-color:var(--warn)}.notice.ok{border-color:var(--ok)}
.spinner{display:none;margin-left:10px;color:var(--muted)}form.busy .spinner{display:inline}
</style></head>
<body><header><a class="brand" href="/">Course Kit</a><a class="sub" href="/">Course</a><a class="sub" href="/settings">Settings</a></header>
<main>{% block body %}{% endblock %}</main>
<script>
document.querySelectorAll('form[data-busy]').forEach(f=>f.addEventListener('submit',()=>{f.classList.add('busy');f.querySelectorAll('button').forEach(b=>b.disabled=true)}));
</script>
{% block script %}{% endblock %}
</body></html>
