name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install and test
        run: |
          pip install -r requirements.txt pytest fastapi uvicorn jinja2 python-multipart httpx
          python -m playwright install --with-deps chromium
          python -m pytest -q tests
      - name: Build zip
        run: |
          echo "${GITHUB_REF_NAME#v}" > VERSION
          mkdir -p dist
          zip -qr dist/course-kit.zip . -x 'dist/*' '.git/*' '.github/*' '*/__pycache__/*' '.pytest_cache/*' 'course/*' 'drafts/*' '.browser-profile/*'
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "$GITHUB_REF_NAME" dist/course-kit.zip --title "Course Kit $GITHUB_REF_NAME" --notes "${NOTES:-Course Kit $GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY"
